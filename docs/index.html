<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papan Proyek Kontraktor</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d2023">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d2023'/%3E%3Crect x='6' y='22' width='20' height='4' fill='%23b4432b'/%3E%3Cpath d='M7 20 L13 13 L18 16 L25 7' stroke='%2380b2d6' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121416);--panel:light-dark(#f2f3f4,#1b1e21);--ink:light-dark(#1d2023,#eceef0);--mute:light-dark(#5d646b,#9aa2a9);--line:light-dark(#dcdfe3,#2d3237);--brick:light-dark(#b4432b,#e36d52);--steel:light-dark(#2f5d7c,#80b2d6);--ok:light-dark(#2c7a4c,#6cc493);--warn:light-dark(#a86f12,#e3ad55);--head:light-dark(#1d2023,#0b0c0d)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(26px,4vw,40px);font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:15px;font-weight:600;font-family:Inter}
.acct{background:var(--head);color:#aab1b8;font-size:13px;padding:8px max(4vw,16px) 0;display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}.acct:empty{display:none}
.acct b{color:#f4f5f6;font-weight:600}.acct button{background:none;border:1px solid #3a4047;color:#c8cdd2;border-radius:6px;padding:3px 10px;font:500 13px Inter;cursor:pointer;min-height:30px}
.top{background:var(--head);color:#f4f5f6;padding:14px max(4vw,16px) 0;border-bottom:6px solid var(--brick)}
.top .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding-bottom:16px}
.top small{color:#aab1b8;display:block;margin-bottom:4px}.top a{color:#f4f5f6}
.tabs{display:flex;gap:2px;overflow-x:auto}.tabs button{background:none;color:#c8cdd2;border:0;padding:12px 14px;font:600 14px Inter;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap;min-height:44px;flex:none}
.tabs button[aria-current=true]{background:var(--bg);color:var(--ink)}
main{padding:22px max(4vw,16px) 60px;max-width:1240px;margin:0 auto}
.btn{font:600 14px Inter;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;min-height:40px;cursor:pointer}
.btn.pri{background:var(--brick);border-color:var(--brick);color:#fff}.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}.btn.ghost{border-color:transparent;background:none;color:var(--mute)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
input,select,textarea{font:16px Inter;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:middle}
td input,td select{font-size:14px;padding:5px 7px;border-color:transparent;background:transparent}td input:hover,td input:focus,td select:hover{border-color:var(--line);background:var(--bg)}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}label>input,label>select,label>textarea{margin-top:4px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));align-items:end}
.card{background:var(--panel);border-radius:10px;padding:16px}
.kpi b{display:block;font:800 clamp(22px,3vw,28px)/1.15 Archivo,Inter,sans-serif;margin:4px 0}.kpi span{font-size:13px;color:var(--mute)}
.proj{display:block;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--bg)}.proj:hover{border-color:var(--brick)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--mute)}
.tag.admin{background:var(--brick);color:#fff}.tag.tim{background:var(--steel);color:#fff}.tag.vendor{background:var(--warn);color:#fff}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;border-radius:4px}
.meta{font-size:13px;color:var(--mute)}.bad{color:var(--brick);font-weight:600}.good{color:var(--ok);font-weight:600}.wrn{color:var(--warn);font-weight:600}
section{margin-top:28px}section>header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sec td{background:var(--panel);font-weight:600}tr.sec input{font-weight:600}tr.foot td{font-weight:600;border-bottom:0}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig .g{stroke:var(--line)}.fig .t{fill:var(--mute);font:12px Inter}.fig .pl{fill:none;stroke:var(--steel);stroke-width:2.5}.fig .rl{fill:none;stroke:var(--brick);stroke-width:2.5}.fig .rd{fill:var(--brick)}.fig .now{stroke:var(--mute);stroke-dasharray:3 4}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute)}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.gantt{position:relative;height:14px;background:var(--panel);border-radius:4px}.gantt i{position:absolute;top:0;bottom:0;background:var(--steel);border-radius:4px;opacity:.8}
.scroll{overflow-x:auto}.empty{padding:40px 20px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:12px}
.rep{border-left:4px solid var(--steel);padding:8px 12px;margin-bottom:10px;background:var(--panel);border-radius:0 8px 8px 0}.rep p{margin:4px 0}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:9}.ov .card{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:92vw}#toast.on{opacity:1}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ph img{width:96px;height:72px;object-fit:cover;border-radius:6px;display:block;background:var(--line)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.login{max-width:420px;margin:6vh auto 0}.login .card{padding:24px}.login form{display:grid;gap:10px;margin-top:12px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.linkbtn{background:none;border:0;color:var(--steel);font:500 14px Inter;cursor:pointer;padding:4px 0;text-decoration:underline}
.chk{display:grid;gap:6px;max-height:220px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:6px;margin-top:4px;background:var(--bg)}.chk label{color:var(--ink);font-size:14px;font-weight:400;display:flex;align-items:center}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
</style></head><body>
<div class="acct" id="acct"></div>
<div class="top" id="top"><div class="row"><div><small>Papan proyek kontraktor</small><h1>Memuat…</h1></div></div></div>
<main id="view"></main>
<div id="toast" role="status"></div>
<div id="dlg"></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body></html>
